services:
  postgres:
    image: postgres:17
    container_name: synapseops-postgres
    environment:
      POSTGRES_DB: synapseops
      POSTGRES_USER: synapseops
      POSTGRES_PASSWORD: synapseops
    ports:
      - "55516:5432"
    volumes:
      - synapseops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseops -d synapseops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: synapseops-redis
    ports:
      - "6379:6379"
    volumes:
      - synapseops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  synapseops_postgres_data:
  synapseops_redis_data: